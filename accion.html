<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Gestión Realizada</title>
    <!-- SDK de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        h2 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="mensajeTitulo">Procesando...</h2>
        <p id="mensajeDetalle">Por favor espera un momento mientras actualizamos el estado de la póliza.</p>
    </div>

    <script>

        const firebaseConfig = {
            apiKey: "AIzaSyBrXWo276aRBXewRm90_H07_cpTa7Rldn0",
            authDomain: "panel-ejecutivo-b2cfb.firebaseapp.com",
            databaseURL: "https://panel-ejecutivo-b2cfb-default-rtdb.firebaseio.com",
            projectId: "panel-ejecutivo-b2cfb",
            storageBucket: "panel-ejecutivo-b2cfb.firebasestorage.app",
            messagingSenderId: "684178249972",
            appId: "1:684178249972:web:b907a71f0bba2b358ba6a1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Leer los parámetros que vienen en la URL del correo (?id=...&accion=...)
        const urlParams = new URLSearchParams(window.location.search);
        const idFirebase = urlParams.get('id');
        const accion = urlParams.get('accion');

        const titulo = document.getElementById('mensajeTitulo');
        const detalle = document.getElementById('mensajeDetalle');

        if (idFirebase && accion) {
            // Definir el nuevo estado según el botón que presionó
            let nuevoEstado = accion === 'renovad' ? 'Renovado' : 'Cancelado';
            if (accion === 'renovar') nuevoEstado = 'Renovado';
            if (accion === 'cancelar') nuevoEstado = 'Cancelado';

            // Actualizar directamente en la base de datos de Firebase
            db.ref('polizas/' + idFirebase).update({
                estadoPoliza: nuevoEstado
            })
            .then(() => {
                if (nuevoEstado === 'Renovado') {
                    titulo.textContent = "¡Renovación!";
                    detalle.textContent = "El estado se ha actualizado correctamente y se han detenido las notificaciones automáticas. Ya puedes cerrar esta pestaña.";
                } else {
                    titulo.textContent = "Cancelación";
                    detalle.textContent = "La póliza ha sido cancelada y los avisos se han detenido. Ya puedes cerrar esta pestaña.";
                }
            })
            .catch((error) => {
                console.error("Error al actualizar:", error);
                titulo.textContent = "Ocurrió un error";
                detalle.textContent = "No pudimos procesar tu avance en este momento. Inténtalo de nuevo más tarde.";
            });
        } else {
            titulo.textContent = "Enlace inválido";
            detalle.textContent = "Faltan parámetros de configuración en la dirección web.";
        }
    </script>
</body>
</html>
